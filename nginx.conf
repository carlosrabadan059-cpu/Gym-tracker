# Equivalente a vercel.json: SPA con vuelta a index.html y las mismas cabeceras.
# La caché se fija con `expires` y no con add_header: un add_header dentro de
# un location anula todas las cabeceras de seguridad heredadas del server.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://n8n.rabadanhouse.space; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

    # Los assets llevan hash en el nombre: caché larga.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # index.html, sw.js y version.json (aviso de versión nueva) siempre frescos.
    location ~ ^/(index\.html|sw\.js|version\.json)$ {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
